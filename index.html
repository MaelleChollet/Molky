<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mölkky VR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <!-- Moteur physique (corps rigides, collisions, frottements, rebonds) -->
  <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  <style>
    :root { --panel: rgba(20, 16, 14, 0.85); --ink: #f4ecdf; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .hud {
      position: fixed; left: 0; right: 0; z-index: 10;
      padding: 12px 16px; text-align: center; pointer-events: none;
    }
    .top { top: 0; background: linear-gradient(rgba(0,0,0,0.65), transparent); }
    .bottom { bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0)); }
    .pill {
      display: inline-block; background: var(--panel); border-radius: 20px;
      padding: 8px 18px; font-size: 14px; border: 1px solid rgba(255,255,255,0.18);
    }
  </style>
</head>
<body>

  <div class="hud top">
    <div class="pill" id="statusMsg">Partie en cours</div>
  </div>
  <div class="hud bottom">
    <div class="pill" id="actionMsg">Attrape la barre au sol avec la main droite (gâchette)</div>
  </div>

  <a-scene renderer="antialias: true; colorManagement: true" vr-mode-ui="enabled: true">

    <!-- Ciel -->
    <a-sky color="#7ec0ee"></a-sky>

    <!-- Éclairage extérieur -->
    <a-entity light="type: ambient; color: #b0c4de; intensity: 0.7;"></a-entity>
    <a-entity light="type: directional; color: #fff8eb; intensity: 1.1; position: 10 25 15; castShadow: true;"></a-entity>

    <!-- Énorme sol carré (120m x 120m) -->
    <a-plane
      rotation="-90 0 0"
      width="120"
      height="120"
      color="#3c733f"
      roughness="0.95"
      shadow="receive: true">
    </a-plane>

    <!-- Les Quilles du Mölkky -->
    <a-entity id="pins"></a-entity>

    <!-- Bâton de lancer (Mölkky) : long axe = axe Z local -->
    <a-box
      id="stick"
      molkky-stick
      width="0.05"
      height="0.05"
      depth="0.38"
      color="#c98a4b">
    </a-box>

    <!-- Joueur (Camera Rig) -->
    <a-entity id="rig" position="0 0 0" vr-stick-movement>
      <!-- Position de la caméra axe Y -->
      <a-entity id="cameraPitch" position="0 1 0">
        <a-camera
          id="camera"
          position="0 0 0"
          look-controls="pointerLockEnabled: false"
          wasd-controls="acceleration: 25">
          <a-cursor fuse="false" color="#ffffff" opacity="0.5" raycaster="objects: .clickable"></a-cursor>
        </a-camera>
      </a-entity>

      <!-- Mains : décalées un peu vers l'avant pour entrer dans le champ de vision -->
      <a-entity id="HandsOffset" position="0 0 -0.3">

        <!-- Manette gauche : Déplacement (Stick) -->
        <a-entity id="leftHand"
                  oculus-touch-controls="hand: left"
                  windows-motion-controls="hand: left"
                  generic-tracked-controller-controls="hand: left">
        </a-entity>

        <!-- Manette droite : Rotation (Stick) + barre de Mölkky -->
        <a-entity id="rightHand"
                  oculus-touch-controls="hand: right"
                  windows-motion-controls="hand: right"
                  generic-tracked-controller-controls="hand: right">
        </a-entity>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- ===== Monde physique (indépendant d'A-Frame) ===== -->
  <script id="physics-core">
    const PHYS = (function () {
      // Groupes de collision
      const G_GROUND = 1, G_PIN = 2, G_STICK = 4;

      // Dimensions et masses (bois de bouleau ≈ 650 kg/m³)
      const PIN_R = 0.038;
      const PIN_MASS = 0.25;           // kg
      const STICK_W = 0.05;
      const STICK_LEN = 0.38;
      const STICK_MASS = 0.4;          // kg

      const FIXED_STEP = 1 / 300;      // petit pas fixe : pas de barre qui traverse une quille
      const MAX_SUBSTEPS = 20;
      const FALLEN_UP_Y = 0.5;         // quille tombée si inclinée de plus de 60°

      const world = new CANNON.World();
      world.gravity.set(0, -9.82, 0);
      world.broadphase = new CANNON.NaiveBroadphase();
      world.solver.iterations = 20;
      world.allowSleep = true;         // les objets immobiles "dorment" : pas de tremblement

      // Matériaux : bois contre bois, bois contre herbe
      const wood = new CANNON.Material('bois');
      const grass = new CANNON.Material('herbe');
      world.addContactMaterial(new CANNON.ContactMaterial(wood, wood, {
        friction: 0.35, restitution: 0.3,
        contactEquationStiffness: 1e7, contactEquationRelaxation: 3
      }));
      world.addContactMaterial(new CANNON.ContactMaterial(wood, grass, {
        friction: 0.6, restitution: 0.12,
        contactEquationStiffness: 1e7, contactEquationRelaxation: 3
      }));

      // Sol
      const ground = new CANNON.Body({ mass: 0, material: grass });
      ground.addShape(new CANNON.Plane());
      ground.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      ground.collisionFilterGroup = G_GROUND;
      ground.collisionFilterMask = G_PIN | G_STICK;
      world.addBody(ground);

      const UP = new CANNON.Vec3(0, 1, 0);
      const Z_TO_Y = new CANNON.Quaternion();
      Z_TO_Y.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2); // le cylindre de cannon est sur Z
      const tmp = new CANNON.Vec3();

      function tune(b, linDamp, angDamp) {
        b.linearDamping = linDamp;       // un peu de résistance de l'air / de l'herbe
        b.angularDamping = angDamp;      // l'herbe freine le roulement
        b.allowSleep = true;
        b.sleepSpeedLimit = 0.05;
        b.sleepTimeLimit = 0.4;
      }

      function makePin(x, z, h) {
        const b = new CANNON.Body({ mass: PIN_MASS, material: wood });
        b.addShape(new CANNON.Cylinder(PIN_R, PIN_R, h, 16), new CANNON.Vec3(), Z_TO_Y);
        b.collisionFilterGroup = G_PIN;
        b.collisionFilterMask = G_GROUND | G_PIN | G_STICK;
        tune(b, 0.1, 0.6);
        b.position.set(x, h / 2, z);
        world.addBody(b);
        b.sleep();
        return b;
      }

      function makeStick(x, z, yaw) {
        const b = new CANNON.Body({ mass: STICK_MASS, material: wood });
        b.addShape(new CANNON.Box(new CANNON.Vec3(STICK_W / 2, STICK_W / 2, STICK_LEN / 2)));
        b.collisionFilterGroup = G_STICK;
        tune(b, 0.05, 0.4);
        b.position.set(x, STICK_W / 2, z);
        b.quaternion.setFromAxisAngle(UP, yaw);
        world.addBody(b);
        setStickHeld(b, false);
        b.sleep();
        return b;
      }

      // Barre tenue en main : elle suit la main et ne touche rien.
      // Barre lâchée : objet physique normal.
      function setStickHeld(b, held) {
        b.velocity.set(0, 0, 0);
        b.angularVelocity.set(0, 0, 0);
        if (held) {
          b.type = CANNON.Body.KINEMATIC;
          b.collisionFilterMask = 0;
        } else {
          b.type = CANNON.Body.DYNAMIC;
          b.collisionFilterMask = G_GROUND | G_PIN;
          b.wakeUp();
        }
      }

      function step(dt) {
        world.step(FIXED_STEP, dt, MAX_SUBSTEPS);
      }

      function upVector(b) {
        return b.quaternion.vmult(UP, tmp);
      }

      function isFallen(b) {
        return upVector(b).y < FALLEN_UP_Y;
      }

      // Centre de la base de la quille, projeté au sol
      function basePos(b, h) {
        const up = upVector(b);
        return { x: b.position.x - up.x * h / 2, z: b.position.z - up.z * h / 2 };
      }

      // Direction horizontale vers laquelle la quille est tombée (pour garder son orientation)
      function fallYaw(b) {
        const up = upVector(b);
        return Math.atan2(up.x, up.z);
      }

      // Tout est-il immobile ?
      function isStill(bodies) {
        for (const b of bodies) {
          if (b.type !== CANNON.Body.DYNAMIC || b.sleepState === CANNON.Body.SLEEPING) continue;
          if (b.velocity.norm() > 0.04 || b.angularVelocity.norm() > 0.4) return false;
        }
        return true;
      }

      // Calcule où relever les quilles tombées : à l'endroit de leur base,
      // en les écartant juste assez si deux bases se chevauchent.
      function planRaise(pins) {
        const MIN_D = 2 * PIN_R + 0.004;
        const pts = pins.map(p => {
          const s = basePos(p.body, p.h);
          return { x: s.x, z: s.z, movable: p.fallen };
        });
        for (let it = 0; it < 30; it++) {
          let moved = false;
          for (let i = 0; i < pts.length; i++) {
            for (let j = i + 1; j < pts.length; j++) {
              const a = pts[i], c = pts[j];
              if (!a.movable && !c.movable) continue;
              let dx = c.x - a.x, dz = c.z - a.z;
              let d = Math.hypot(dx, dz);
              if (d >= MIN_D) continue;
              if (d < 1e-6) { dx = Math.random() - 0.5; dz = Math.random() - 0.5; d = Math.hypot(dx, dz); }
              const push = (MIN_D - d) / d;
              const share = a.movable && c.movable ? 0.5 : 1;
              if (a.movable) { a.x -= dx * push * share; a.z -= dz * push * share; }
              if (c.movable) { c.x += dx * push * share; c.z += dz * push * share; }
              moved = true;
            }
          }
          if (!moved) break;
        }
        return pts;
      }

      // Pose une quille debout, immobile
      function placeStanding(b, h, x, z, yaw) {
        b.position.set(x, h / 2, z);
        b.quaternion.setFromAxisAngle(UP, yaw);
        b.velocity.set(0, 0, 0);
        b.angularVelocity.set(0, 0, 0);
      }

      return {
        world, PIN_R, STICK_W,
        makePin, makeStick, setStickHeld, step,
        isFallen, basePos, fallYaw, isStill, planRaise, placeStanding
      };
    })();
  </script>

  <script>
    // Configuration du jeu : la quille 1 est à l'avant (z = -1.5), orientée vers le joueur en z = 0
    const LAYOUT = [
      [0, -1.50, 1],
      [-0.15, -1.65, 2], [0.15, -1.65, 3],
      [-0.30, -1.85, 4], [0, -1.80, 5], [0.30, -1.85, 6],
      [-0.45, -2.05, 7], [-0.15, -2.00, 8], [0.15, -2.00, 9], [0.45, -2.05, 10],
      [-0.60, -2.25, 11], [0.60, -2.25, 12]
    ];
    const STICK_START = { x: 0, z: -0.6, yaw: Math.PI / 2 };

    let pins = [];

    const $ = id => document.getElementById(id);

    // ===== Déplacement / rotation avec les sticks =====
    AFRAME.registerComponent('vr-stick-movement', {
      init: function () {
        this.moveSpeed = 0.05;       // Vitesse de marche
        this.turnSpeed = 90;         // Rotation horizontale (degrés/seconde)
        this.pitchSpeed = 70;        // Inclinaison verticale (degrés/seconde)
        this.deadZone = 0.15;        // Zone morte pour éviter le drift

        this.moveAxes = [0, 0];      // [x, y] stick gauche
        this.turnAxis = [0, 0];      // [x, y] stick droit

        const leftHand = document.getElementById('leftHand');
        const rightHand = document.getElementById('rightHand');
        const cam = document.getElementById('camera');
        this.cameraPitchEl = document.getElementById('cameraPitch');

        // Joystick gauche (Déplacement)
        leftHand.addEventListener('axismove', (e) => {
          const x = e.detail.axis[2] !== undefined ? e.detail.axis[2] : e.detail.axis[0];
          const y = e.detail.axis[3] !== undefined ? e.detail.axis[3] : e.detail.axis[1];
          this.moveAxes[0] = Math.abs(x) > this.deadZone ? x : 0;
          this.moveAxes[1] = Math.abs(y) > this.deadZone ? y : 0;
        });

        // Joystick droit (Rotation)
        rightHand.addEventListener('axismove', (e) => {
          const x = e.detail.axis[2] !== undefined ? e.detail.axis[2] : e.detail.axis[0];
          const y = e.detail.axis[3] !== undefined ? e.detail.axis[3] : e.detail.axis[1];
          this.turnAxis[0] = Math.abs(x) > this.deadZone ? x : 0;
          this.turnAxis[1] = Math.abs(y) > this.deadZone ? y : 0;
        });

        this.camEl = cam;

        // En VR, la hauteur vient du casque : on retire le décalage de 1 m
        const scene = this.el.sceneEl;
        scene.addEventListener('enter-vr', () => {
          this.cameraPitchEl.setAttribute('position', { x: 0, y: 0, z: 0 });
        });
        scene.addEventListener('exit-vr', () => {
          this.cameraPitchEl.setAttribute('position', { x: 0, y: 1, z: 0 });
        });
      },

      tick: function (time, timeDelta) {
        const delta = timeDelta / 1000;

        if (this.turnAxis[0] !== 0) {
          const rigRot = this.el.getAttribute('rotation');
          rigRot.y -= this.turnAxis[0] * this.turnSpeed * delta;
          this.el.setAttribute('rotation', rigRot);
        }

        if (this.turnAxis[1] !== 0) {
          const pitchRot = this.cameraPitchEl.getAttribute('rotation');
          pitchRot.x = THREE.MathUtils.clamp(
            pitchRot.x + this.turnAxis[1] * this.pitchSpeed * delta,
            -45,
            45
          );
          this.cameraPitchEl.setAttribute('rotation', pitchRot);
        }

        // Déplacement relatif à l'orientation du casque
        if (this.moveAxes[0] !== 0 || this.moveAxes[1] !== 0) {
          const rigPos = this.el.getAttribute('position');

          const camYRot = this.camEl.getAttribute('rotation').y;
          const rigYRot = this.el.getAttribute('rotation').y;
          const angleRad = THREE.MathUtils.degToRad(camYRot + rigYRot);

          const sin = Math.sin(angleRad);
          const cos = Math.cos(angleRad);

          const strafe = this.moveAxes[0] * this.moveSpeed;
          const forward = this.moveAxes[1] * this.moveSpeed;

          rigPos.x += strafe * cos + forward * sin;
          rigPos.z += -strafe * sin + forward * cos;

          this.el.setAttribute('position', rigPos);
        }
      }
    });

    // Support clavier ZQSD (en plus de WASD natif)
    window.addEventListener('keydown', e => {
      const wasd = $('camera').components['wasd-controls'];
      if (!wasd) return;
      const k = e.key.toLowerCase();
      if (k === 'z') wasd.keys.KeyW = true;
      if (k === 'q') wasd.keys.KeyA = true;
      if (k === 's') wasd.keys.KeyS = true;
      if (k === 'd') wasd.keys.KeyD = true;
    });

    window.addEventListener('keyup', e => {
      const wasd = $('camera').components['wasd-controls'];
      if (!wasd) return;
      const k = e.key.toLowerCase();
      if (k === 'z') wasd.keys.KeyW = false;
      if (k === 'q') wasd.keys.KeyA = false;
      if (k === 's') wasd.keys.KeyS = false;
      if (k === 'd') wasd.keys.KeyD = false;
    });

    // ===== Quilles (visuel + corps physique) =====
    function buildPins() {
      const wrap = $('pins');
      wrap.innerHTML = '';
      pins = [];

      LAYOUT.forEach(([x, z, num]) => {
        const h = 0.15 + (num * 0.01);
        // L'origine du groupe = le centre de la quille (comme le corps physique)
        const g = document.createElement('a-entity');

        const body = document.createElement('a-cylinder');
        body.setAttribute('radius', PHYS.PIN_R);
        body.setAttribute('height', h);
        body.setAttribute('color', '#dfb887');
        body.setAttribute('roughness', '0.6');

        const label = document.createElement('a-text');
        label.setAttribute('value', num);
        label.setAttribute('align', 'center');
        label.setAttribute('color', '#2d1806');
        label.setAttribute('width', 2);
        label.setAttribute('position', `0 ${h / 2 + 0.002} 0`);   // posé sur le dessus
        label.setAttribute('rotation', '-90 0 0');

        g.appendChild(body);
        g.appendChild(label);
        wrap.appendChild(g);

        pins.push({ el: g, num, h, body: PHYS.makePin(x, z, h), fallen: false });
      });
    }

    function syncPins() {
      pins.forEach(p => {
        p.el.object3D.position.copy(p.body.position);
        p.el.object3D.quaternion.copy(p.body.quaternion);
      });
    }

    // Règle du Mölkky : une seule quille = sa valeur, plusieurs = leur nombre
    function showResult(fallen) {
      const n = fallen.length;
      if (n === 0) { $('statusMsg').textContent = 'Raté. 0 point'; return; }
      const nums = fallen.map(p => p.num).sort((a, b) => a - b).join(', ');
      const points = n === 1 ? fallen[0].num : n;
      $('statusMsg').textContent =
        `${n} quille${n > 1 ? 's' : ''} tombée${n > 1 ? 's' : ''} (${nums}) : ${points} point${points > 1 ? 's' : ''}`;
    }

    // ===== Réglages du lancer =====
    const HOLD_DIST = 0.1;         // la barre est tenue un peu devant la main (m)
    const UP = new THREE.Vector3(0, 1, 0);

    // ===== Composant de la barre + boucle de jeu =====
    AFRAME.registerComponent('molkky-stick', {
      schema: {
        grabDist: { default: 0.7 },       // distance horizontale pour l'attraper (m)
        returnDelay: { default: 2500 },   // attente avant de relever les quilles (ms)
        boost: { default: 1.4 },          // multiplicateur de puissance du geste
        maxSpeed: { default: 12 },        // vitesse maxi du lancer (m/s)
        maxSpin: { default: 20 }          // rotation maxi de la barre (rad/s)
      },

      init() {
        // États : ground -> holding -> flying -> waiting -> raising -> returning -> ready -> holding ...
        this.state = 'ground';
        this.hand = $('rightHand');
        this.vel = new THREE.Vector3();
        this.spin = new THREE.Vector3();
        this.handPos = new THREE.Vector3();
        this.handPrev = new THREE.Vector3();
        this.handVel = new THREE.Vector3();
        this.handAng = new THREE.Vector3();
        this.handQuat = new THREE.Quaternion();
        this.handQuatPrev = new THREE.Quaternion();
        this.dq = new THREE.Quaternion();
        this.dir = new THREE.Vector3();
        this.fwd = new THREE.Vector3(0, 0, -1);   // direction horizontale de la main
        this.tmp = new THREE.Vector3();
        this.p = new THREE.Vector3();
        this.from = new THREE.Vector3();
        this.fromQuat = new THREE.Quaternion();
        this.toQuat = new THREE.Quaternion();
        this.history = [];                        // vitesses récentes de la main
        this.yaw = STICK_START.yaw;               // orientation de la barre (rotation Y)
        this.timer = 0;
        this.flyTime = 0;
        this.stillTime = 0;
        this.t = 0;
        this.raise = [];

        buildPins();
        this.body = PHYS.makeStick(STICK_START.x, STICK_START.z, STICK_START.yaw);
        this.syncStickFromBody();
        syncPins();

        $('actionMsg').textContent = 'Attrape la barre au sol avec la main droite (gâchette)';

        // La barre se joue uniquement avec la main droite
        const h = $('rightHand');
        h.addEventListener('triggerdown', () => this.onDown(h));
        h.addEventListener('triggerup', () => this.onUp(h));
        h.addEventListener('gripdown', () => this.onDown(h));
        h.addEventListener('gripup', () => this.onUp(h));
      },

      syncStickFromBody() {
        this.el.object3D.position.copy(this.body.position);
        this.el.object3D.quaternion.copy(this.body.quaternion);
      },

      syncBodyFromStick() {
        const o = this.el.object3D;
        this.body.position.set(o.position.x, o.position.y, o.position.z);
        this.body.quaternion.set(o.quaternion.x, o.quaternion.y, o.quaternion.z, o.quaternion.w);
      },

      // ----- 1. Attraper / tenir la barre -----
      onDown(h) {
        this.history.length = 0;
        if (this.state === 'ground') {
          h.object3D.getWorldPosition(this.tmp);
          const s = this.el.object3D.position;
          const d = Math.hypot(this.tmp.x - s.x, this.tmp.z - s.z);   // distance horizontale
          if (d > this.data.grabDist) return;
          this.hand = h;
          this.readHand(0);
          this.handVel.set(0, 0, 0);
          this.handAng.set(0, 0, 0);
          PHYS.setStickHeld(this.body, true);
          this.state = 'holding';
          $('actionMsg').textContent = 'Balance le bras et relâche la gâchette pour lancer !';
        } else if (this.state === 'ready' && h === this.hand) {
          this.state = 'holding';
          $('actionMsg').textContent = 'Balance le bras et relâche la gâchette pour lancer !';
        }
      },

      onUp(h) {
        if (this.state === 'holding' && h === this.hand) this.throwStick();
      },

      // Lit la main : position, vitesse, vitesse de rotation, direction horizontale
      readHand(dt) {
        this.hand.object3D.getWorldPosition(this.handPos);
        this.hand.object3D.getWorldQuaternion(this.handQuat);

        if (dt > 0) {
          // vitesse linéaire
          this.tmp.copy(this.handPos).sub(this.handPrev).divideScalar(dt);
          this.handVel.lerp(this.tmp, 0.4);                 // lissage

          // vitesse de rotation du poignet : dq = q_now * q_prev^-1
          this.dq.copy(this.handQuatPrev).invert().premultiply(this.handQuat);
          if (this.dq.w < 0) { this.dq.x *= -1; this.dq.y *= -1; this.dq.z *= -1; this.dq.w *= -1; }
          const s = Math.sqrt(Math.max(0, 1 - this.dq.w * this.dq.w));
          if (s > 1e-5) {
            const angle = 2 * Math.acos(Math.min(1, this.dq.w));
            this.tmp.set(this.dq.x / s, this.dq.y / s, this.dq.z / s).multiplyScalar(angle / dt);
          } else {
            this.tmp.set(0, 0, 0);
          }
          this.handAng.lerp(this.tmp, 0.4);

          this.history.push({ v: this.handVel.clone(), w: this.handAng.clone() });
          if (this.history.length > 10) this.history.shift();
        }
        this.handPrev.copy(this.handPos);
        this.handQuatPrev.copy(this.handQuat);

        // Barre horizontale, en travers de la direction où pointe la main
        this.dir.set(0, 0, -1).applyQuaternion(this.handQuat);
        const h = Math.hypot(this.dir.x, this.dir.z);
        if (h > 0.2) {
          this.fwd.set(this.dir.x / h, 0, this.dir.z / h);
          this.yaw = Math.atan2(this.fwd.z, -this.fwd.x);
        }
      },

      holdPos(out) {
        out.copy(this.handPos);
        out.x += this.fwd.x * HOLD_DIST;
        out.z += this.fwd.z * HOLD_DIST;
        return out;
      },

      followHand() {
        const o = this.el.object3D;
        o.position.copy(this.holdPos(this.p));
        o.quaternion.setFromAxisAngle(UP, this.yaw);        // toujours à plat
        this.syncBodyFromStick();
      },

      // ----- 2. Lancer : la barre devient un objet physique -----
      throwStick() {
        // On prend l'échantillon le plus rapide des dernières images :
        // la main ralentit au moment où on relâche la gâchette.
        let best = null, bestLen = 0;
        this.history.forEach(s => {
          const l = s.v.length();
          if (l > bestLen) { bestLen = l; best = s; }
        });

        this.vel.set(0, 0, 0);
        this.spin.set(0, 0, 0);
        if (best) {
          this.vel.copy(best.v).multiplyScalar(this.data.boost);
          this.spin.copy(best.w);
        }
        const sp = this.vel.length();
        if (sp > this.data.maxSpeed) this.vel.multiplyScalar(this.data.maxSpeed / sp);
        const sw = this.spin.length();
        if (sw > this.data.maxSpin) this.spin.multiplyScalar(this.data.maxSpin / sw);

        // La barre part à plat, en travers de la direction du lancer
        const hs = Math.hypot(this.vel.x, this.vel.z);
        if (hs > 0.3) this.yaw = Math.atan2(this.vel.z, -this.vel.x);
        this.el.object3D.quaternion.setFromAxisAngle(UP, this.yaw);
        this.syncBodyFromStick();

        PHYS.setStickHeld(this.body, false);
        this.body.velocity.set(this.vel.x, this.vel.y, this.vel.z);
        this.body.angularVelocity.set(this.spin.x, this.spin.y, this.spin.z);

        this.flyTime = 0;
        this.stillTime = 0;
        this.state = 'flying';
        $('statusMsg').textContent = 'Partie en cours';
        $('actionMsg').textContent = 'Lancé !';
      },

      // On attend que tout soit immobile (barre et quilles) avant de compter
      watchThrow(dt) {
        this.flyTime += dt;
        const bodies = [this.body, ...pins.map(p => p.body)];
        this.stillTime = PHYS.isStill(bodies) ? this.stillTime + dt : 0;
        if ((this.flyTime > 0.5 && this.stillTime > 0.4) || this.flyTime > 10) this.settle();
      },

      settle() {
        this.state = 'waiting';
        this.timer = 0;
        pins.forEach(p => { p.fallen = PHYS.isFallen(p.body); });
        showResult(pins.filter(p => p.fallen));
        $('actionMsg').textContent = 'Les quilles se relèvent dans quelques secondes…';
      },

      // ----- 3. Relever les quilles là où leur base est tombée -----
      startRaise() {
        // La barre ne doit plus rien toucher pendant qu'on relève les quilles
        PHYS.setStickHeld(this.body, true);

        const targets = PHYS.planRaise(pins);
        this.raise = [];
        pins.forEach((p, i) => {
          if (!p.fallen) return;
          const yaw = PHYS.fallYaw(p.body);
          const to = new THREE.Vector3(targets[i].x, p.h / 2, targets[i].z);
          const toQ = new THREE.Quaternion().setFromAxisAngle(UP, yaw);
          this.raise.push({
            p, yaw, to, toQ,
            from: new THREE.Vector3().copy(p.body.position),
            fromQ: new THREE.Quaternion().copy(p.body.quaternion)
          });
        });
        this.t = 0;
        this.state = 'raising';
      },

      raisePins(dt) {
        this.t = Math.min(this.t + dt / 0.35, 1);
        const e = this.t * this.t * (3 - 2 * this.t);
        this.raise.forEach(r => {
          const o = r.p.el.object3D;
          o.position.lerpVectors(r.from, r.to, e);
          o.quaternion.copy(r.fromQ).slerp(r.toQ, e);
        });
        if (this.t < 1) return;

        this.raise.forEach(r => {
          PHYS.placeStanding(r.p.body, r.p.h, r.to.x, r.to.z, r.yaw);
          r.p.fallen = false;
        });
        // On réveille tout le monde : une quille qui s'appuyait sur une autre retombe naturellement
        pins.forEach(p => p.body.wakeUp());
        this.startReturn();
      },

      // ----- 4. Retour automatique de la barre dans la main -----
      startReturn() {
        this.from.copy(this.el.object3D.position);
        this.fromQuat.copy(this.el.object3D.quaternion);
        this.t = 0;
        this.state = 'returning';
      },

      returnToHand(dt) {
        const o = this.el.object3D;
        this.t = Math.min(this.t + dt / 0.7, 1);                   // 0,7 s de trajet
        const e = this.t * this.t * (3 - 2 * this.t);
        this.holdPos(this.p);
        this.toQuat.setFromAxisAngle(UP, this.yaw);
        o.position.lerpVectors(this.from, this.p, e);
        o.position.y += Math.sin(Math.PI * e) * 0.3;                // petit arc
        o.quaternion.copy(this.fromQuat).slerp(this.toQuat, e);
        this.syncBodyFromStick();
        if (this.t >= 1) {
          this.state = 'ready';
          $('statusMsg').textContent = 'Partie en cours';
          $('actionMsg').textContent = 'Barre en main : maintiens la gâchette, puis relâche en lançant';
        }
      },

      tick(time, dtMs) {
        const dt = Math.min(dtMs / 1000, 0.05);

        switch (this.state) {
          case 'holding':
          case 'ready':
            this.readHand(dt); this.followHand(); break;
          case 'waiting':
            this.timer += dtMs;
            if (this.timer >= this.data.returnDelay) this.startRaise();
            break;
          case 'raising':
            this.raisePins(dt);
            return;                                  // physique en pause pendant le relevage
          case 'returning':
            this.readHand(dt); this.returnToHand(dt); break;
        }

        PHYS.step(dt);
        syncPins();
        if (this.state === 'ground' || this.state === 'flying' || this.state === 'waiting') {
          this.syncStickFromBody();
        }
        if (this.state === 'flying') this.watchThrow(dt);
      }
    });
  </script>
</body>
